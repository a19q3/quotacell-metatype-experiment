[package]
name = "quotacell-payment-cap"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace]

[dependencies]
ckb-metatype = { git = "https://github.com/a19q3/ckb-metatype", tag = "v0.1.1", version = "=0.1.1" }
ckb-metatype-contracts = { git = "https://github.com/a19q3/ckb-metatype", tag = "v0.1.1", version = "=0.1.1" }
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "calc-hash"] }

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true
panic = "abort"
strip = true
