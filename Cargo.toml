[package]
name = "quotacell-metatype-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
autobins = false

[features]
riscv-binaries = []

[dependencies]
ckb-hash = { version = "=1.1.1", default-features = false, features = ["ckb-contract"] }
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "calc-hash"] }
ckb-metatype = { git = "https://github.com/a19q3/ckb-metatype", tag = "v0.1.0" }
ckb-metatype-contracts = { git = "https://github.com/a19q3/ckb-metatype", tag = "v0.1.0" }

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true
panic = "abort"
strip = true

[[bin]]
name = "fund-lock"
path = "src/bin/fund-lock.rs"
required-features = ["riscv-binaries"]

[[bin]]
name = "quota-type"
path = "src/bin/quota-type.rs"
required-features = ["riscv-binaries"]

[[bin]]
name = "quota-adapter"
path = "src/bin/quota-adapter.rs"
required-features = ["riscv-binaries"]

[[bin]]
name = "payment-cap"
path = "src/bin/payment-cap.rs"
required-features = ["riscv-binaries"]

[[bin]]
name = "composed-fund-lock"
path = "src/bin/composed-fund-lock.rs"
required-features = ["riscv-binaries"]
